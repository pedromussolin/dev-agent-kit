name: Validate agent kit

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install executor dependencies
        run: python -m pip install -e '.[monitor,test]'
      - name: Check portable skills and generated profiles
        run: python scripts/provider_profiles.py --check
      - name: Test executor, packaging and project preservation
        run: python -m unittest discover -s tests -v
      - name: Check patch formatting
        run: git diff --check
